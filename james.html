<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AireGuard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#f7f5f2;
    --card:#ffffffcc;
    --text:#111;
    --sub:#777;
    --accent:#c6a96b;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
    font-family:Inter;
    background:linear-gradient(180deg,#faf8f5,#f1ede7);
    color:var(--text);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* APP FRAME */
.app{
    width:100%;
    max-width:430px;
    height:100vh;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* HEADER */
.header{
    text-align:center;
    margin-top:10px;
}

.title{
    font-family:"Playfair Display";
    font-size:26px;
    letter-spacing:1px;
}

.subtitle{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
    letter-spacing:2px;
}

/* CENTER BUTTON */
.center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.button{
    width:180px;
    height:180px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#e8e2d9);
    box-shadow:
        0 10px 30px rgba(0,0,0,0.1),
        inset 0 2px 6px rgba(255,255,255,0.8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:600;
    letter-spacing:2px;
    cursor:pointer;
    transition:0.2s;
}

/* 🔥 PULSE ANIMATION WHEN ACTIVE */
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(198,169,107,0.6); }
    70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(198,169,107,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(198,169,107,0); }
}

.button.active{
    background:linear-gradient(145deg,#d4c2a1,#b89b64);
    color:white;
    animation: pulse 1.8s infinite;
}

.button:active{
    transform:scale(0.95);
}

/* STATUS */
.status{
    background:var(--card);
    backdrop-filter: blur(20px);
    border-radius:14px;
    padding:14px;
    font-size:13px;
    display:flex;
    justify-content:space-between;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#aaa;
}

.active .dot{
    background:green;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="title">AireGuard</div>
    <div class="subtitle">by AireStore | Alarm</div>
</div>

<div class="center">
    <div class="button active" id="mainBtn">
        <span id="btnText">LISTENING...</span>
    </div>

    <div class="button" onclick="window.location.href='aireguard.html'">
        <span>HOME</span>
    </div>
</div>



<div class="status active" id="status">
    <div>System</div>
    <div id="statusText">Voice Alarm</div>
</div>

</div>

<script>
let recognition;
let listening = false;

const REDIRECT_URL =
    "https://airstore780-svg.github.io/aireguard/aireguardrecorder.html";

window.onload = () => {
    startSpeechRecognition();
};

function startSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("btnText").textContent = "NOT SUPPORTED";
        document.getElementById("statusText").textContent =
            "Speech recognition unavailable";
        return;
    }

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = () => {
        listening = true;

        document.getElementById("btnText").textContent = "LISTENING...";
        document.getElementById("statusText").textContent =
            "Active Voice Alarm";
    };

    recognition.onresult = (event) => {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {
            transcript += event.results[i][0].transcript;
        }

        transcript = transcript.toLowerCase().trim();

        console.log("Heard:", transcript);

        /*
         * Only trigger when "james" is recognized
         * as a separate word.
         */
        const jamesDetected = /\bjames\b/i.test(transcript);

        if (jamesDetected) {

            listening = false;

            document.getElementById("btnText").textContent =
                "TRIGGERED";

            document.getElementById("statusText").textContent =
                "Voice Command Detected";

            recognition.stop();

            window.location.href = REDIRECT_URL;
        }
    };

    recognition.onerror = (event) => {

        console.error("Speech recognition error:", event.error);

        /*
         * Don't permanently kill the listener on transient
         * errors such as no-speech or network interruptions.
         */
        if (event.error !== "not-allowed") {
            restartRecognition();
        }
    };

    recognition.onend = () => {

        /*
         * Chrome/Safari can automatically terminate continuous
         * recognition. Restart it unless James already triggered.
         */
        if (listening) {
            restartRecognition();
        }
    };

    recognition.start();
}


function restartRecognition() {

    if (!recognition || !listening) return;

    setTimeout(() => {

        try {
            recognition.start();
        } catch (e) {
            console.log("Recognition restart:", e);
        }

    }, 300);
}

</body>
</html>
